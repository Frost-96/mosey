name: Behavior lifecycle diagnostic
on:
  push:
    branches:
      - test/69-behavior-input-probe
permissions:
  contents: read
jobs:
  package:
    name: Package preparation
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MOSEY_VERIFICATION_CHANNEL: package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: preparation
        run: node tools/measure-verification.ts package pnpm package:mac
      - id: archive
        name: Archive this commit's local unsigned app
        run: |
          ditto -c -k --keepParent out/Mosey-darwin-arm64/Mosey.app out/Mosey-darwin-arm64.zip
          git rev-parse HEAD > out/package-commit.txt
          shasum -a 256 out/Mosey-darwin-arm64.zip > out/package-sha256.txt
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: apple-silicon-app
          path: |
            out/Mosey-darwin-arm64.zip
            out/package-commit.txt
            out/package-sha256.txt
            out/package-measurement.json
            out/package-manifest.json
          if-no-files-found: error
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-preparation-evidence
          path: test-results/

  lifecycle-packaged:
    name: Lifecycle harness (packaged)
    needs: package
    runs-on: macos-15
    timeout-minutes: 15
    env:
      MOSEY_TEST_SCALE_FACTOR: "1"
      MOSEY_VERIFICATION_CHANNEL: lifecycle-packaged
      MOSEY_TEST_MODE: packaged
      MOSEY_PREPARATION_RESULT: ${{ needs.package.result }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: download
        uses: actions/download-artifact@v4
        with:
          name: apple-silicon-app
          path: out
      - id: preparation
        name: Verify package identity and unpack
        run: |
          test "$(cat out/package-commit.txt)" = "$(git rev-parse HEAD)"
          shasum -a 256 -c out/package-sha256.txt
          ditto -x -k out/Mosey-darwin-arm64.zip out/Mosey-darwin-arm64
          node tools/verify-package.ts
      - id: diagnostic-order
        name: Configure observed failing CI file order
        run: |
          mkdir -p test-results/verification
          cat > test-results/verification/behavior-order.mjs <<'EOF'
          import { BaseSequencer } from "vitest/node";

          const order = new Map([
            ["session-quit-dispatch.test.ts", 0],
            ["behavior-input-lifecycle.test.ts", 1],
            ["settings-readiness-lifecycle.test.ts", 2],
          ]);

          export default class BehaviorOrder extends BaseSequencer {
            async sort(files) {
              const rank = (file) => {
                const name = file.moduleId.split("/").at(-1);
                const value = order.get(name);
                if (value === undefined)
                  throw new Error(`Unexpected lifecycle file: ${file.moduleId}`);
                return value;
              };
              return [...files].sort((left, right) => rank(left) - rank(right));
            }
          }
          EOF
          cat > test-results/verification/behavior-order.config.ts <<'EOF'
          import base from "../../vitest.config.ts";
          import BehaviorOrder from "./behavior-order.mjs";

          export default {
            ...base,
            test: {
              ...base.test,
              sequence: { ...base.test.sequence, sequencer: BehaviorOrder },
            },
          };
          EOF
      - id: inventory
        run: |
          mkdir -p test-results/verification
          node tools/measure-verification.ts collection pnpm exec vitest list --no-static-parse --config test-results/verification/behavior-order.config.ts --project lifecycle-packaged --json=test-results/verification/inventory.json
      - id: verification
        run: node tools/measure-verification.ts test pnpm exec vitest run --config test-results/verification/behavior-order.config.ts --project lifecycle-packaged --reporter=default --reporter=json --outputFile=test-results/verification/tests.json
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-packaged-evidence
          path: test-results/
