name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Unique groups protect pending main runs too: false alone still allows
  # newer pushes to replace an older pending run in the same group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      # Workflow-level paths-ignore would leave required checks pending.
      - uses: actions/github-script@v8
        id: paths
        with:
          script: |
            let files;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.issue.number, per_page: 100,
              });
              // The PR endpoint caps its response at 3,000 files. Fail open.
              if (files.length >= 3000) files = undefined;
            } else if (context.eventName === 'push' && !/^0+$/.test(context.payload.before)) {
              const comparison = await github.rest.repos.compareCommits({
                ...context.repo, base: context.payload.before, head: context.sha,
              });
              files = comparison.data.files;
              // Compare responses contain at most 300 files. Never skip an
              // incompletely enumerated change, including large pushes.
              if (files?.length >= 300) files = undefined;
            }
            const documentation = /^(?:README\.md|GLOSSARY\.md|AGENTS\.md|CLAUDE\.md|LICENSE|docs\/.*\.md|\.claude\/.*)$/;
            const code = !files?.length || files.some(file =>
              !documentation.test(file.filename) ||
              (file.previous_filename && !documentation.test(file.previous_filename)));
            core.setOutput('code', String(code));
            core.summary.addRaw(code ? 'Full application validation.' : 'Documentation only; application jobs skipped.');
            await core.summary.write();

  static:
    name: Static and deterministic checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          install-scripts: "false"
      - run: pnpm check
      - run: pnpm test:tooling
      - run: pnpm exec vitest run --project deterministic

  acceptance:
    name: Application acceptance (${{ matrix.shard }}/5)
    # Five macOS runners at most may run at once. A separate packaging job
    # left four of them idle for ~2.5 minutes, so shard 1 packages the app
    # itself while shards 2-5 begin development validation immediately and
    # fetch the package between their development and packaged phases.
    # Every shard still owns an isolated serial desktop.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    permissions:
      contents: read
      # Shards 2-5 poll this run's artifacts and shard 1's packaging step.
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Restore verified incremental build receipts
        # Receipts fingerprint their inputs, outputs and toolchain, so a stale
        # entry only causes a rebuild. Without them a fresh checkout regenerates
        # committed character atlases (~13s) and recompiles Swift helpers (~15s).
        # Only small entries: receipts and the ~0.5 MB native helpers.
        id: receipts
        uses: actions/cache/restore@v4
        with:
          path: |
            build/incremental
            build/native
          key: incremental-${{ runner.os }}-${{ github.sha }}
          restore-keys: incremental-${{ runner.os }}-
      - name: Package the application
        id: package
        if: matrix.shard == 1
        run: pnpm package:mac
      - name: Save incremental build receipts
        # Keyed by content: unchanged receipts never add another cache entry.
        if: steps.package.outcome == 'success' && !startsWith(steps.receipts.outputs.cache-matched-key, format('incremental-{0}-{1}', runner.os, hashFiles('build/incremental/**', 'build/native/**')))
        uses: actions/cache/save@v4
        with:
          path: |
            build/incremental
            build/native
          key: incremental-${{ runner.os }}-${{ hashFiles('build/incremental/**', 'build/native/**') }}
      - name: Share the packaged application
        if: steps.package.outcome == 'success'
        # Fast ZIP compression retains bytes, modes and symlinks. PNG assets
        # gain little from spending another full compression pass on the app.
        run: ditto -c -k --zlibCompressionLevel 1 --keepParent out/Mosey-darwin-arm64/Mosey.app out/Mosey-darwin-arm64.zip
      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success'
        with:
          name: apple-silicon-app
          path: out/Mosey-darwin-arm64.zip
          compression-level: 0
          retention-days: 7
          # A re-run of shard 1 replaces the package of its earlier attempt.
          overwrite: true
      - name: Development application acceptance
        # A packaging failure must not suppress development validation.
        if: ${{ !cancelled() }}
        env:
          MOSEY_CI_PHASE: development
        run: pnpm test:ci --shard=${{ matrix.shard }}/5
      - name: Wait for the package from shard 1
        id: wait
        if: ${{ !cancelled() && matrix.shard != 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shared() {
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=apple-silicon-app" \
              --jq '[.artifacts[] | select(.expired | not)] | length')" -gt 0 ]
          }
          # Shard 1 usually shares the package minutes before development
          # validation ends here. Stop as soon as it can no longer share one.
          deadline=$((SECONDS + 1200))
          until shared; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Application acceptance (1/5)")
                | .status + " " + ([.steps[] | select(.name == "Share the packaged application") | .conclusion // "pending"] | first // "pending")')
            case "$state" in
              "completed "* | *" failure" | *" cancelled" | *" skipped")
                shared && break
                echo "::error::Shard 1 did not share a package ($state)"
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the package from shard 1"
              exit 1
            fi
            sleep 10
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      # Without a status function GitHub prepends success(), which would skip
      # fetching the package after a development failure while the packaged
      # phase still ran against a missing application.
      - uses: actions/download-artifact@v4
        id: download
        if: ${{ !cancelled() && steps.wait.outputs.ready == 'true' }}
        with:
          name: apple-silicon-app
          path: out
      - name: Unpack the application built by this run
        id: unpack
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        run: ditto -x -k out/Mosey-darwin-arm64.zip out/Mosey-darwin-arm64
      - name: Packaged application acceptance
        # A development failure must not suppress packaged validation either,
        # but it only runs against an application this shard actually holds.
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || steps.unpack.outcome == 'success') }}
        env:
          MOSEY_CI_PHASE: packaged
        run: pnpm test:ci --shard=${{ matrix.shard }}/5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-${{ matrix.shard }}
          path: test-results/ci-matrix-*.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.shard }}-evidence
          path: |
            test-results/
            build/timings.jsonl
          retention-days: 7

  checks:
    name: Application checks
    if: always()
    needs: [changes, static, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable validation channel
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          if (results.changes.result !== 'success') process.exit(1);
          const expected = results.changes.outputs.code === 'true' ? 'success' : 'skipped';
          for (const name of ['static', 'acceptance']) {
            if (results[name].result !== expected) {
              console.error(`${name}: expected ${expected}, received ${results[name].result}`);
              process.exitCode = 1;
            }
          }
          JS
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
        with:
          # This gate reads only the inventory and its built-in-only checker.
          # Do not download character artwork again after acceptance has run.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /package.json
            /tools/check-ci-coverage.ts
            /tests/*.test.ts
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: matrix-*
          path: test-results/ci-coverage
      - name: Verify complete mode and scale coverage without duplicates
        if: needs.changes.outputs.code == 'true'
        run: node tools/check-ci-coverage.ts test-results/ci-coverage
