name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOSEY_VERIFICATION_CHANNEL: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: verification
        run: pnpm check
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-evidence
          path: test-results/

  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOSEY_VERIFICATION_CHANNEL: deterministic
      MOSEY_TEST_MODE: deterministic
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: inventory
        run: |
          mkdir -p test-results/verification
          node tools/measure-verification.ts collection pnpm exec vitest list --no-static-parse --project deterministic --json=test-results/verification/inventory.json
      - id: verification
        run: node tools/measure-verification.ts test pnpm test:deterministic --reporter=default --reporter=json --outputFile=test-results/verification/tests.json
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evidence
          path: test-results/

  development:
    name: Development (requested ${{ matrix.scale }}x)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scale: ["1", "2"]
    env:
      MOSEY_TEST_SCALE_FACTOR: ${{ matrix.scale }}
      MOSEY_VERIFICATION_CHANNEL: development
      MOSEY_TEST_MODE: development
    # One Vitest worker owns this runner's real desktop. Other jobs have
    # separate runners; an assertion here is not a package prerequisite.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: inventory
        run: |
          mkdir -p test-results/verification
          node tools/measure-verification.ts collection pnpm exec vitest list --no-static-parse --project development --json=test-results/verification/inventory.json
      - id: verification
        run: node tools/measure-verification.ts test pnpm test:dev --reporter=default --reporter=json --outputFile=test-results/verification/tests.json
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-requested-${{ matrix.scale }}x-evidence
          path: test-results/

  package:
    name: Package preparation
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MOSEY_VERIFICATION_CHANNEL: package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: preparation
        run: node tools/measure-verification.ts package pnpm package:mac
      - id: archive
        name: Archive this commit's local unsigned app
        run: |
          ditto -c -k --keepParent out/Mosey-darwin-arm64/Mosey.app out/Mosey-darwin-arm64.zip
          git rev-parse HEAD > out/package-commit.txt
          shasum -a 256 out/Mosey-darwin-arm64.zip > out/package-sha256.txt
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: apple-silicon-app
          path: |
            out/Mosey-darwin-arm64.zip
            out/package-commit.txt
            out/package-sha256.txt
            out/package-measurement.json
          if-no-files-found: error
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-preparation-evidence
          path: test-results/

  packaged:
    name: Packaged (requested ${{ matrix.scale }}x)
    needs: package
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scale: ["1", "2"]
    env:
      MOSEY_TEST_SCALE_FACTOR: ${{ matrix.scale }}
      MOSEY_VERIFICATION_CHANNEL: packaged
      MOSEY_TEST_MODE: packaged
      MOSEY_PREPARATION_RESULT: ${{ needs.package.result }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - id: dependencies
        run: pnpm install --frozen-lockfile
      - id: download
        uses: actions/download-artifact@v4
        with:
          name: apple-silicon-app
          path: out
      - id: preparation
        name: Verify package identity and unpack
        run: |
          test "$(cat out/package-commit.txt)" = "$(git rev-parse HEAD)"
          shasum -a 256 -c out/package-sha256.txt
          ditto -x -k out/Mosey-darwin-arm64.zip out/Mosey-darwin-arm64
      - id: inventory
        run: |
          mkdir -p test-results/verification
          node tools/measure-verification.ts collection pnpm exec vitest list --no-static-parse --project packaged --json=test-results/verification/inventory.json
      - id: verification
        run: node tools/measure-verification.ts test pnpm test:packaged --reporter=default --reporter=json --outputFile=test-results/verification/tests.json
      - name: Record result
        if: always()
        env:
          MOSEY_VERIFICATION_STATUS: ${{ job.status }}
          MOSEY_VERIFICATION_STEPS: ${{ toJSON(steps) }}
        run: node tools/record-verification.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-requested-${{ matrix.scale }}x-evidence
          path: test-results/
