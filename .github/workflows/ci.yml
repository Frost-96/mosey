name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    # Both serial suites include real-time Dock recovery and renderer lifecycles.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:mac
      - name: Preceding renderer recovery scenarios
        run: pnpm test:packaged tests/renderer-recovery.test.ts
      - name: Repeated original packaged sleep with stage evidence
        run: |
          mkdir -p test-results/sleep-timeout
          for sleep_run in 1 2 3 4 5; do
            MOSEY_REPRO_RUN=$sleep_run DEBUG=pw:api pnpm test:packaged tests/sleep.test.ts > test-results/sleep-timeout/repeat-$sleep_run.log 2>&1 || { cat test-results/sleep-timeout/repeat-$sleep_run.log; exit 1; }
          done
      - name: Archive local unsigned app
        run: ditto -c -k --keepParent out/Mosey-darwin-arm64/Mosey.app out/Mosey-darwin-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-silicon-app-and-test-evidence
          path: |
            out/Mosey-darwin-arm64.zip
            test-results/
