name: Temporary renderer crash diagnosis
on:
  push:
    branches: [fix/settings-migration-lifecycle]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scale: ["1", "2"]
    env:
      MOSEY_TEST_SCALE_FACTOR: ${{ matrix.scale }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:mac
      - run: pnpm exec vitest run --config .github/ci-probe/vitest.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-crash-probe-${{ matrix.scale }}x
          path: test-results/
